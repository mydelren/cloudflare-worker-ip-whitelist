name = "cf-ip-whitelist"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Your Cloudflare account ID (from Dashboard > right sidebar)
account_id = "YOUR_ACCOUNT_ID"

kv_namespaces = [
  { binding = "DEVICE_IPS", id = "YOUR_KV_NAMESPACE_ID" }
]

# Enable Workers Logs for debugging in the Dashboard
[observability]
enabled = true
head_sampling_rate = 1
